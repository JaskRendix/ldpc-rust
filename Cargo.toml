[package]
name = "ldpc-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1.37", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_arrays = "0.2"
serde_json = { version = "1.0", optional = true }
tower = { version = "0.5", optional = true }
rand = { version = "0.10", default-features = false, features = ["alloc", "sys_rng", "std_rng", "thread_rng"] }
rand_distr = { version = "0.6", default-features = false, features = ["alloc"] }
tower-http = { version = "0.7", features = ["timeout"], optional = true }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
spin = "0.12"

[dev-dependencies]
criterion = "0.8"
proptest = "1.5"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["std"]

[[bin]]
name = "ber_spa"
path = "src/bin/ber_spa.rs"
required-features = ["std"]

[[bin]]
name = "custom_ber_spa"
path = "src/bin/custom_ber_spa.rs"
required-features = ["std"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["std"]

[[test]]
name = "server_tests"
path = "tests/server_tests.rs"
required-features = ["std"]

[[bench]]
name = "ldpc_bench"
harness = false

[features]
default = ["std"]
std = [
    "dep:clap",
    "dep:axum",
    "dep:tokio",
    "dep:serde_json",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing-subscriber",
]