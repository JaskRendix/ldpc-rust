[package]
name = "ldpc-rust"
version = "0.1.0"
edition = "2021"
authors = ["Giorgio"]
license = "MIT"
description = "Hard-decision LDPC decoder (CCSDS 128x512) in Rust"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
rand = "0.10"
rand_distr = "0.6"
tower-http = { version = "0.7", features = ["timeout"] }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
