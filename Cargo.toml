[package]
name = "ldpc-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_arrays = "0.2"
serde_json = "1.0"
tower = "0.5"
rand = "0.10"
rand_distr = "0.6"
tower-http = { version = "0.7", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1.5"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bench]]
name = "ldpc_bench"
harness = false